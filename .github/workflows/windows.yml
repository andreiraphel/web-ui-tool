name: Build Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Bundle ripgrep
        shell: pwsh
        run: |
          $version = "14.1.1"
          $zip = "ripgrep.zip"
          $url = "https://github.com/BurntSushi/ripgrep/releases/download/$version/ripgrep-$version-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath rg
          Copy-Item "rg/ripgrep-$version-x86_64-pc-windows-msvc/rg.exe" "target/release/rg.exe"
          Compress-Archive -Path "target/release/cpseudo.exe","target/release/rg.exe" -DestinationPath "cpseudo-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpseudo-windows
          path: cpseudo-windows.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cpseudo-windows.zip
